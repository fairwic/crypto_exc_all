[package]
name = "okx"
version = "0.2.1"
edition = "2021"
authors = ["fairwic <chaoliushishangfaner@gmail.com>"]
description = "OKX交易所API SDK"
license = "MIT"
repository = "https://github.com/fairwic/okx_rs"
readme = "README.md"
keywords = ["okx", "cryptocurrency", "trading", "api", "sdk"]
categories = ["api-bindings", "finance"]

[features]
default = ["full"]
public-market = []
full = [
    "public-market",
    "dep:anyhow",
    "dep:base64",
    "dep:chrono",
    "dep:dotenv",
    "dep:futures",
    "dep:hmac",
    "dep:once_cell",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:url",
]

[dependencies]
tokio = { version = "1.37.0", optional = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "full",
] }
reqwest = { version = "0.11.27", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1.0.202", features = ["derive"] }
serde_json = { version = "1.0.117", features = ["arbitrary_precision"] }
thiserror = "1.0.57"
log = "0.4.21"
chrono = { version = "0.4.35", optional = true }
base64 = { version = "0.21.7", optional = true }
hmac = { version = "0.12.1", optional = true }
sha2 = { version = "0.10.8", optional = true }
futures = { version = "0.3.30", optional = true }
tokio-tungstenite = { version = "0.28", optional = true, features = ["rustls-tls-webpki-roots"] }
anyhow = { version = "1.0.79", optional = true }
url = { version = "2.5.0", optional = true }
dotenv = { version = "0.15.0", optional = true }
once_cell = { version = "1.19.0", optional = true }
serde_path_to_error = "0.1"

[dev-dependencies]
tokio = { version = "1.37.0", features = ["rt", "rt-multi-thread", "macros"] }
tokio-test = "0.4.3"
mockito = "1.2.0"
env_logger = "0.11.1"

# 自定义lib 目录
[lib]
path = "src/lib.rs"
# 当需要使用workspace时，需要注释掉workspace
# [workspace]
