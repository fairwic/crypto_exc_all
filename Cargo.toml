[package]
name = "crypto_exc_all"
version = "0.1.2"
edition = "2024"
description = "Unified cryptocurrency exchange SDK facade"
license = "MIT"

[workspace]
members = [
    "okx_rs",
    "binance_rs",
    "bitget_rs",
    "bybit_rs",
    "gate_rs",
    "hyperliquid_rs",
]
resolver = "2"

[features]
default = ["okx", "binance", "bitget", "bybit", "gate", "hyperliquid"]
full-sdk = ["dep:dotenv"]
okx-public-market = ["dep:okx_rs", "okx_rs/public-market"]
okx-public-candle-ws = ["dep:okx_rs", "okx_rs/full"]
okx = ["full-sdk", "okx-public-market", "okx_rs/full"]
binance-public-instrument = ["dep:binance_rs"]
binance-public-kline = ["dep:binance_rs"]
binance = ["full-sdk", "binance-public-instrument", "binance-public-kline"]
bitget = ["full-sdk", "dep:bitget_rs"]
bybit = ["full-sdk", "dep:bybit_rs"]
gate = ["full-sdk", "dep:gate_rs"]
hyperliquid = ["full-sdk", "dep:hyperliquid_rs"]

[dependencies]
binance_rs = { package = "bnb_rs", version = "0.1.0", path = "binance_rs", optional = true }
bitget_rs = { version = "0.1.0", path = "bitget_rs", optional = true }
bybit_rs = { version = "0.1.0", path = "bybit_rs", optional = true }
gate_rs = { version = "0.1.0", path = "gate_rs", optional = true }
hyperliquid_rs = { version = "0.1.0", path = "hyperliquid_rs", optional = true }
okx_rs = { package = "okx", version = "0.2.1", path = "okx_rs", optional = true, default-features = false }
dotenv = { version = "0.15.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[dev-dependencies]
mockito = "1.7.0"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }
