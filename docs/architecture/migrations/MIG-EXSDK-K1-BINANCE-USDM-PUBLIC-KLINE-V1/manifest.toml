[behavior]
business_goal = "为 Market 后继提供 Binance USD-M typed、无凭证、只读 K 线协议能力，完整保留 12 个标准 wire 字段、后续扩展字段以及同次 HTTP/provider 失败证据。"
invariants = [
  "请求固定为匿名 GET /fapi/v1/klines，只忠实传递 symbol、interval、startTime、endTime、limit，不发送 API Key、Secret、签名或账户 header。",
  "symbol 与 interval 必须是非空、无空白的可打印 ASCII；limit 若存在必须大于零。当前官方 request schema 未给稳定最大值，SDK 不硬编码、裁剪或改写调用方 limit。",
  "标准 12 个数组位置全部必需；任一位置缺失或类型损坏时整批 response fail-closed，不再使用空字符串或 None 掩盖坏行。",
  "OHLC、base/quote volume 与 taker-buy volume 使用 wire string 或 arbitrary-precision JSON number，SDK 不转 f64、不量化为领域 Decimal。",
  "open_time 与 close_time 保留 Unix 毫秒；SDK 不依据本机时钟推断 final/confirmed，也不把 REST row 与 WebSocket x 字段混为同一协议。",
  "trade_count 保留整数；ignore 字段及第 12 位之后的新增字段原样保留，不赋予业务含义。",
  "HTTP status、provider code/message、Retry-After 与 provider quota header 继续通过 I1 建立的 typed evidence 暴露；SDK 不执行 retry、sleep、pagination、quota accounting 或 completeness 判断。",
  "legacy get_klines -> serde_json::Value、root full-sdk Candle facade、研究月包和 WebSocket K 线链路保持可编译且不宣称已迁移。",
]
current_entrypoints = [
  "BinanceMarket::get_klines(KlineRequest) -> serde_json::Value",
  "root MarketFacade::candles -> binance_candles_from_value -> Candle(closed=None)",
  "legacy Core CandleService::fetch_candles_from_crypto_exc_all -> root full-sdk facade",
]
target_entrypoints = [
  "BinanceMarket::get_klines_typed",
  "BinanceUsdmPublicKlineClient::klines",
  "BinanceUsdmKline",
  "BinancePublicMarketSdkError",
]
allowed_differences = [
  "新增 typed response 和最小 binance-public-kline feature；legacy raw Value 方法保留。",
  "新入口对非法 symbol/interval/limit fail-fast，并对损坏 row fail-closed。",
  "第 12 位之后的 provider 字段作为 extra 保留，而不是静默丢弃。",
]
forbidden_differences = [
  "不得在 SDK 内生成 ConfirmedCandle、判定 finality、按时钟丢弃当前棒或映射领域 Decimal。",
  "不得在 SDK 内实现分页循环、增量 cursor、重试、sleep、quota bucket、scheduler、lease、run ledger 或恢复。",
  "不得新增或改写 K 线分表、market_candles、repository、数据库角色或 schema tool。",
  "不得读取用户 credential、固定 service API key，或触发账户读取、下单、撤单、平仓与任何 exchange mutation。",
  "不得迁移或删除 research Binance Vision、Binance WebSocket、OKX 或其他 provider 路径。",
]
characterization_evidence = [
  "docs/architecture/migrations/MIG-EXSDK-K1-BINANCE-USDM-PUBLIC-KLINE-V1/business-semantics-matrix.md",
  "docs/architecture/migrations/MIG-EXSDK-K1-BINANCE-USDM-PUBLIC-KLINE-V1/callsite-closure.md",
]

