[behavior]
business_goal = "让 Binance USD-M 与 OKX 公共 K 线/instrument facade 从调用方显式接收 endpoint、请求超时和可选代理，使未来 Market source profile 能审计真实 transport，同时保留 legacy 环境构造器的既有调用方。"
invariants = [
  "Binance 与 OKX 使用各自独立的 public transport config，不建立抹平 provider 差异的跨交易所万能配置。",
  "显式配置只包含非业务 endpoint、毫秒超时和可选代理；不包含 API Key、Secret、passphrase、账户、用户、source_profile_id、quota 或 mutation capability。",
  "两个 provider 的默认公共 endpoint 分别为 https://fapi.binance.com 与 https://www.okx.com，默认请求超时均为 5000 毫秒，默认不使用代理。",
  "目标 root public Kline/instrument facade 不读取 std::env、dotenv 或进程全局配置；现有 api_url-only config struct shape 保持，new(config) 映射到显式默认 transport。",
  "新增 with_transport 入口完整应用 endpoint、timeout 与 proxy；timeout=0、非法 endpoint 或非法 proxy 在网络 I/O 前失败。",
  "endpoint 只允许 http/https，且不得携带 userinfo、query 或 fragment；错误和 Debug 不回显可能含凭证的 proxy URL。",
  "请求 endpoint、query、wire DTO、Decimal 文本、HTTP/provider evidence 与匿名认证语义保持不变。",
  "SDK 不实现 retry、sleep、quota accounting、source profile 绑定、egress identity、scheduler、lease、cursor、run ledger、数据库或完整性判断。",
  "BinanceClient::new_public 等已有环境型 legacy 构造器继续保留；其生产/测试/example 调用方不在 K2 静默改写。",
  "OKX public transport 支持与 Binance 对照的 HTTP(S)/SOCKS proxy 构造能力，但两家的 config 类型和错误仍保持 provider 可见。",
]
current_entrypoints = [
  "BinanceClient::new_public -> Config::from_env -> api_url/api_timeout_ms/proxy_url",
  "BinanceUsdmPublicKlineClient::new -> BinanceClient::new_public + optional set_base_url",
  "BinanceUsdmPublicInstrumentClient::new -> BinanceClient::new_public + optional set_base_url",
  "OkxClient::new_public -> hard-coded endpoint/5000ms/no proxy",
  "OkxPublicMarketClient::new and OkxPublicInstruments::new/with_base_url",
  "rust_quant_alpha market-worker wiring -> root Kline clients with default config",
]
target_entrypoints = [
  "BinanceClient::new_public_with_transport(BinancePublicTransportConfig)",
  "OkxClient::new_public_with_transport(OkxPublicTransportConfig)",
  "BinanceUsdmPublicKlineClient::with_transport",
  "BinanceUsdmPublicInstrumentClient::with_transport",
  "OkxPublicMarketClient::with_transport",
  "OkxSwapPublicInstrumentClient::with_transport",
  "existing root new(config) -> explicit provider default transport without ambient env",
]
allowed_differences = [
  "目标 root Binance public facade 不再继承 BINANCE_API_URL/BINANCE_API_TIMEOUT_MS/BINANCE_PROXY_URL 或 dotenv；调用方必须使用显式 transport 入口。",
  "非法 endpoint、timeout=0 与非法 proxy 从请求期错误提前为构造期 ConfigError。",
  "OKX public-only dependency 增加 SOCKS proxy transport feature；不增加账户或签名 capability。",
  "新增公共 config 的 Debug 只显示 proxy_configured，不显示 proxy URL。",
]
forbidden_differences = [
  "不得删除或改变 BinanceClient::new_public、BinanceMarket::new_default、WebSocket/example/test 的 legacy 环境配置语义。",
  "不得把 source_profile_id、egress_identity 或 PublicQuotaKey 放进 SDK transport config；它们归 Market/App 绑定。",
  "不得新增固定 service API Key、用户 credential fallback、签名 header、账户读取或交易 mutation。",
  "不得修改 K 线/instrument endpoint、query、DTO、Decimal/f64、finality、排序、分页、响应 evidence 或 provider error 语义。",
  "不得实现 retry、sleep、scheduler、quota coordinator、lease、source failover、数据库写入或 runtime wiring。",
  "不得修改 rust_quant_alpha caller；Market 的 source-profile/egress 装配必须由后继 Owner Manifest 承接。",
]
characterization_evidence = [
  "docs/architecture/migrations/MIG-EXSDK-K2-BINANCE-OKX-EXPLICIT-PUBLIC-TRANSPORT-V1/business-semantics-matrix.md",
  "docs/architecture/migrations/MIG-EXSDK-K2-BINANCE-OKX-EXPLICIT-PUBLIC-TRANSPORT-V1/callsite-closure.md",
]

