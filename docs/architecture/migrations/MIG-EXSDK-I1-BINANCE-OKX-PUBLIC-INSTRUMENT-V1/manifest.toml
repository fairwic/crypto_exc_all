[behavior]
business_goal = "为 Market 后继提供只含 Binance USDⓈ-M 与 OKX SWAP 的 typed、无凭证、只读 instrument 协议能力，并保留 provider 错误与限频证据。"
invariants = [
  "Binance 请求固定为 GET /fapi/v1/exchangeInfo 且无 query；OKX 请求固定为 GET /api/v5/public/instruments?instType=SWAP。",
  "两个入口都由无账户凭证 client 发起，不发送交易认证、passphrase、签名或模拟交易 header。",
  "provider symbol/instId、产品类型、原始状态、listing/expiry time、资产、规则与未知扩展字段均由 typed DTO 保留。",
  "价格、数量、tick、lot、notional、multiplier 与合约价值使用 wire string 或任意精度 JSON number；I1 不转 f64。",
  "单个必需字段损坏使整个 response 解码失败；SDK 不 filter_map、不从缺行推断 delisted，也不把空列表解释为完整业务快照。",
  "HTTP status、provider code/message 可回传给 Market；Retry-After 与 provider quota header 仅在 provider 实际返回时原样保留，未返回时保持 absent；SDK 不执行重试、sleep、调度或 business completeness 判断。",
  "既有 Binance Value 入口、OKX K 线 capability 和其他 provider module 保持可编译，不因 I1 被删除、禁用或宣称迁移。",
]
current_entrypoints = [
  "BinanceMarket::new_public -> get_exchange_info -> serde_json::Value",
  "OkxPublicData::get_instruments -> correct public path through signed transport",
  "OkxMarket::get_instruments -> anonymous transport through incorrect /api/v5/market/instruments path",
  "legacy rust_quant ExchangeSymbolSyncService -> Binance raw SDK plus OKX direct reqwest",
]
target_entrypoints = [
  "BinanceUsdmPublicInstrumentClient::exchange_info",
  "OkxSwapPublicInstrumentClient::instruments",
]
allowed_differences = [
  "新增 typed response、保留未知字段的 provider DTO、HTTP evidence、provider 实际返回的 quota evidence 和 root 最小 public feature facade。",
  "新增独立 typed 方法而保留 Binance legacy Value 方法；旧 OKX 错误入口不再被新 facade 使用。",
  "JSON decimal number 以 arbitrary-precision Number 保留，不再要求调用方先转 f64。",
]
forbidden_differences = [
  "不得在 SDK 选择 perpetual/quote/settle inventory、映射 canonical status/InstrumentRules 或产生 Decimal 领域对象。",
  "不得新增数据库、表、scheduler、lease、cursor、run ledger、Outbox、Signal、ExecutionRequest 或用户 credential。",
  "不得在 SDK 内重试、sleep、静默裁剪 provider rows/fields、猜测 unknown enum 或用调用方过滤集冒充完整 response。",
  "不得触发下单、撤单、平仓、账户读取或任何 exchange mutation。",
  "不得迁移、禁用或删除 Bitget、Bybit、Gate、Hyperliquid、KuCoin 等延期 provider。",
]
characterization_evidence = [
