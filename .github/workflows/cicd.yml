name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'bybit_rs/**'
      - 'gate_rs/**'
      - '.github/workflows/cicd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'bybit_rs/**'
      - 'gate_rs/**'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test non-live crates
        run: |
          cargo test -p bybit_rs --lib --quiet
          cargo test -p gate_rs --lib --quiet
          cargo test -p crypto_exc_all --lib --quiet
